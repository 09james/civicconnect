{% extends "base.html" %}
{% block title %}Log in | CivicConnect{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-5">
    <div class="card p-4 p-md-5">
      <h1 class="h3 mb-2">Welcome back</h1>
      <p class="text-secondary mb-4">Log in to follow up on your service requests.</p>
      <form method="post" novalidate>
        {% csrf_token %}
        {% include "partials/form_fields.html" with form=form %}
        <button class="btn btn-primary w-100 mt-2" type="submit">Log in</button>
        <input type="hidden" name="next" value="{{ next }}">
      </form>
      <p class="small mt-4 mb-0 text-center">New to CivicConnect? <a href="{% url 'accounts:register' %}">Create an account</a></p>
    </div>
  </div>
</div>
{% endblock %}
